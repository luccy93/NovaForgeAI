apiVersion: v1
kind: ConfigMap
metadata:
  name: novaforge-config
  namespace: novaforge
data:
  APP_NAME: "NovaForge AI"
  APP_VERSION: "0.1.0"
  DEBUG: "false"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/novaforge"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379/0"
