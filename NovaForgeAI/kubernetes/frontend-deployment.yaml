apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: novaforge
  labels:
    app: novaforge
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novaforge
      tier: frontend
  template:
    metadata:
      labels:
        app: novaforge
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: novaforge/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: novaforge
  labels:
    app: novaforge
    tier: frontend
spec:
  selector:
    app: novaforge
    tier: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: novaforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
