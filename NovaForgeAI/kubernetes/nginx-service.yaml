apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: novaforge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
spec:
  selector:
    app: novaforge
    tier: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
    - port: 9113
      targetPort: 9113
      name: metrics
  type: LoadBalancer
